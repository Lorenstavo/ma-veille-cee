name: Regulatory watch

on:
  schedule:
    # 08:07 Paris in summer (CEST), checked again in the script.
    - cron: "7 6 * * 1-5"
    # 08:07 Paris in winter (CET), checked again in the script.
    - cron: "7 7 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Contrôler les sources sans modifier ni committer de fichier"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: regulatory-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check CEE regulatory sources
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # The scheduled workflow is deliberately gated until its first manual
      # DRY_RUN has been reviewed. Set the repository variable to "true" only
      # after validation; workflow_dispatch always remains available.
      SCHEDULED_RUN_ENABLED: ${{ vars.REGULATORY_WATCH_ENABLED || 'false' }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      PISTE_LEGIFRANCE_CLIENT_ID: ${{ secrets.PISTE_LEGIFRANCE_CLIENT_ID }}
      PISTE_LEGIFRANCE_CLIENT_SECRET: ${{ secrets.PISTE_LEGIFRANCE_CLIENT_SECRET }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run regulatory watch
        run: node scripts/run-regulatory-watch.mjs

      - name: Commit successful watch result
        id: commit
        if: success() && env.DRY_RUN != 'true'
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/data/regulatory-watch-state.json scripts/data/pending-regulatory-items.json; then
            echo "created=no" >> "$GITHUB_OUTPUT"
            echo "Commit créé : non"
            exit 0
          fi
          git config user.name "ma-veille-cee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html scripts/data/regulatory-watch-state.json scripts/data/pending-regulatory-items.json
          git commit -m "chore(watch): regulatory update $(TZ=Europe/Paris date +%F)"
          git push origin HEAD:main
          echo "created=yes" >> "$GITHUB_OUTPUT"
          echo "Commit créé : oui"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          echo "Commit créé : ${{ steps.commit.outputs.created || 'non évalué (DRY_RUN ou échec)' }}"
