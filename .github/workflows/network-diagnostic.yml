name: Network diagnostic (temporary)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/diagnose-network.mjs
      - run: |
          echo "Runner outbound IPv4:"
          curl -4 -sS https://api.ipify.org || true
